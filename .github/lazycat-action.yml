version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: omnivoice

build:
  toolchains: []
  run_buildscript: false

images:
  - id: omnivoice
    target: service
    service: omnivoice
    source: docker.io/palashdeb/omnivoice-studio
    channel: stable
    sort: semver
    tag_regex: '^v?[0-9]+\.[0-9]+\.[0-9]+$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: VoiceStudio
    summary: "VoiceStudio LazyCat package published from GitHub Actions"
